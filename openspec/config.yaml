schema: spec-driven

context: |
  Cyclop — нативное macOS-приложение на SwiftUI/AppKit (Swift 6 toolchain,
  swiftLanguageMode v5, цель macOS 15+). Вырез MacBook превращается в панель:
  плеер, полка для файлов, история буфера, сниппеты, календарь, перевод, заметки.
  Форк outsid3rx/cyclop, развивается самостоятельно от апстрима akalikbergenov/cyclop.

  Язык проекта: русский внутри — артефакты OpenSpec, коммиты и комментарии в коде
  пишутся по-русски. Наружу приложение говорит на двух языках.

  Архитектура и механика реализации подробно описаны в README.md, раздел
  "How it works" — он canonical, читать его, а не пересказывать. Структура:
  Sources/Cyclop/{App,Notch,Model,Services,UI}, плюс Sources/CyclopMediaHelper/helper.m.

  Ограничения, которые нельзя ломать походя:
  - Приложение живёт без разрешений. Единственное, что оно когда-либо запрашивает, —
    доступ к календарю, и только по явному нажатию кнопки. Фича, требующая
    Accessibility, Automation или Screen Recording, ломает это обещание.
  - Простой стоит 0.0 % CPU. Правило: таймер работает только пока кто-то видит его
    результат. Новый таймер следует тому же правилу и несёт tolerance.
  - Now Playing держится на приватном MediaRemote и на /usr/bin/perl как
    platform-бинаре без library validation; фолбэк на AppleScript должен работать.
  - Панель открыта, пока на ней указатель — единственное правило. Пиннинг пробовали
    и убрали.

  Тестов в проекте нет. Единственная автоматическая проверка — CI
  .github/workflows/build.yml: сборка бандла через ./Scripts/bundle.sh release,
  наличие бинаря и libcyclopmedia.dylib, обе таблицы Localizable.strings,
  совпадение версии в Info.plist со Scripts/version, codesign --verify --strict,
  и совпадение ключей перевода с кодом.

  Локализация: ключ = английский текст строки, а не идентификатор. Скрипт проверки
  видит литералы в localized(...), Text(...), Button(...), TextField(...);
  литералы с интерполяцией ключами не считаются. Добавил UI-строку — обнови обе
  таблицы в Resources/{en,ru}.lproj/.

  Версия живёт только в Scripts/version. Релиз через ./Scripts/release.sh требует
  написанного руками docs/releases/<version>.md.

rules:
  proposal:
    - "Явно указывай, требует ли изменение новых системных разрешений — это главный компромисс в этом приложении."
  design:
    - "Объясняй почему, а не что: в репозитории это выдержано строго."
    - "Если решение затрагивает стоимость простоя или частоту таймеров, скажи об этом прямо."
  tasks:
    - "Задача, добавляющая UI-строку, включает обновление обеих таблиц Resources/en.lproj и Resources/ru.lproj (Localizable.strings) — иначе CI упадёт."
    - "Проверка изменений — ./Scripts/bundle.sh release, а не тесты: их нет."
